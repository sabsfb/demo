# =============================================================================
# Demo: opt-in (on-demand) mutation testing in GitHub Actions
# -----------------------------------------------------------------------------
# This is a SANITIZED, generic template. It contains NO internal endpoints,
# project names, business document types, or defect data. It showcases one
# reusable CI pattern:
#
#   A slow, non-blocking job (mutation testing) that does NOT run on every
#   push / PR, but only when a human manually triggers the workflow and flips
#   a toggle. This saves 15-60 minutes of CI time on every ordinary commit.
#
# Repo: <your-public-repo>
# Author: based on a real internal CI setup, sanitized for public sharing.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual trigger with an opt-in toggle — this is the core of the pattern.
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Run mutation testing (slow & non-blocking, ~15-60 min)"
        type: boolean
        default: false

# Cancel an in-progress run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — fast fail on lint / obvious issues.
  # ---------------------------------------------------------------------------
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check .

  # ---------------------------------------------------------------------------
  # Gate 2 — unit / api tests with coverage. Always runs on push & PR.
  # ---------------------------------------------------------------------------
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest pytest-cov
      - run: pytest -m "not mutation" --cov=src

  # ---------------------------------------------------------------------------
  # Gate 3 — coverage summary / artifact. Depends on tests passing.
  # ---------------------------------------------------------------------------
  coverage-report:
    needs: [test-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Upload coverage artifact or post a PR summary here."

  # ---------------------------------------------------------------------------
  # OPT-IN HEAVY JOB
  # Runs ONLY when a human manually triggers the workflow AND checks the box.
  # push / PR never trigger it -> saves 15-60 min of CI on every commit.
  # Because it has no `needs:` dependency, skipping it does NOT block the
  # other gates (it is a reference metric, not a merge gate).
  # ---------------------------------------------------------------------------
  mutation-testing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutation == true }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install mutmut
      - run: mutmut run --paths-to-mutate=src
      - run: mutmut show

  # ---------------------------------------------------------------------------
  # EXTENSION EXAMPLE (commented out so the demo stays lightweight & free):
  # Integration tests that need LibreOffice / ImageMagick can be their own
  # job that apt-installs the binaries, mirroring how the real project runs
  # docx-processing tests in CI.
